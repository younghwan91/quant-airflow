x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_USER}:${AIRFLOW_META_PASSWORD}@airflow-meta-db/${AIRFLOW_META_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # **새 DAG 는 켜진 채로 등록된다.** Airflow 기본값은 `true`(= paused 로 등록)이고,
  # 이 설정이 없어서 실제로 두 DAG 가 조용히 안 돌았다(2026-09-01 발견):
  #
  #   daily_price_adjust              08-27 추가 → 실행 0회, daily_bars_adjusted 2거래일 결측
  #   monthly_listed_shares_backfill  08-28 추가 → 실행 0회
  #
  # 켤 자리가 웹 UI 뿐인데 그 UI 는 `profiles: ["ui"]` 라 평소에 안 뜬다. 그래서
  # "추가했는데 안 돈다"가 아무 신호 없이 지나갔다 — `wait_and_stop.sh` 의
  # `pending_dags()` 는 `NOT is_paused` 라 paused DAG 를 세지도 않고, 실행이
  # 없으니 실패도 없어서 창은 매일 초록불로 닫혔다.
  #
  # **끄고 싶으면 코드에 적는다.** `daily_krx_shares` 가 그 예다 — 소스가 막혀서
  # 안 돌려야 하는데 메타DB 의 paused 플래그 대신 `schedule=None` 을 쓴다. 그러면
  # 그 의도가 코드 리뷰에 보이고, DB 를 새로 만들어도 유지된다. 메타DB 에만 있는
  # 상태는 둘 다 안 된다.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  # 개인 서버라 스케줄러/파서 기본 폴링 주기가 과함 (CPU 80~100% 지속 관측됨).
  # 폴링 간격을 늘려 유휴 CPU/팬 소음을 낮춤.
  #
  # MIN_FILE_PROCESS_INTERVAL 이 300 → 1800 인 이유: 5분마다 DAG 파일 12개를
  # 재파싱하면 파일당 1~2초 × 12 / 300초 ≈ 지속 5~8% CPU 다. DAG 파일은 배포할
  # 때만 바뀌므로 30분이면 충분하고, 급하면 스케줄러를 재시작하면 된다.
  # SCHEDULER_IDLE_SLEEP_TIME 은 더 늘리지 말 것 — 지금도 10:00 스케줄이
  # 10:00:45 에 시작한다.
  AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "30"
  AIRFLOW__SCHEDULER__PROCESSOR_POLL_INTERVAL: "30"
  AIRFLOW__SCHEDULER__SCHEDULER_IDLE_SLEEP_TIME: "15"
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "1800"
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "600"
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "1800"
  # 동시 실행 태스크 상한. 기본값은 32 라, 스택이 며칠 안 뜬 뒤 기동하면
  # catchup=False 여도 DAG 12개가 각각 밀린 런 1개씩을 **한꺼번에** 띄운다 —
  # 스페어 PC 가 스래싱한다.
  #
  # 5 인 이유: 정상 최대 동시 실행이 3 이다(화요일 오전 = short_credit 10:00 +
  # catchup 10:05 + listed_shares 10:10). 상한을 그 3 에 딱 맞추면 여유가 0 이라
  # ExternalTaskSensor 의 poke 하나가 48분짜리 런 뒤에 줄을 선다. 2 만큼 여유를
  # 두되 32 보다는 훨씬 낮게 잡는다.
  AIRFLOW__CORE__PARALLELISM: "5"
  KR_QUANT_SQLITE_PATH: ${KR_QUANT_SQLITE_PATH}
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: 5432
  TIMESCALE_DB: ${TIMESCALE_DB}
  TIMESCALE_USER: ${TIMESCALE_USER}
  TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    <<: *airflow-common-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./collectors:/opt/airflow/collectors
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
    # 콜렉터는 이제 자체 보유(./collectors) — 이 마운트는 weekly_price_adjust.py의
    # kr_quant.price_adjust 실행 1건에만 남아 있음(README/Dockerfile 참고).
    - ../kr-quant:/opt/kr-quant:ro
    # 미국(Sharadar) 파이프라인 — daily_sharadar / weekly_sharadar_universe.
    # kr-quant 와 같은 방식: 코드는 ro 로 마운트만 하고 pip install 하지 않으며
    # PYTHONPATH(src 레이아웃)로 찾는다(_common.sharadar_env).
    - ../opt_portfolio:/opt/opt-portfolio:ro
    # 스토어(us_micro.duckdb, 2.7GB)만 rw. 레포 전체를 rw 로 열 이유가 없다 —
    # DAG 가 쓰는 건 이 DuckDB 파일 하나다.
    - ${US_DATA_DIR:-/home/young/data}:/opt/us-data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-meta-db:
      condition: service_healthy
    timescaledb:
      condition: service_healthy

services:
  airflow-meta-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_META_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_META_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_META_DB}
    volumes:
      - airflow-meta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_META_USER}"]
      interval: 30s
      retries: 10
    restart: unless-stopped

  # Shared app data — this is what the main PC queries over the LAN, kept
  # separate from Airflow's own metadata DB above.
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_DB: ${TIMESCALE_DB}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./sql/init_timescale.sql:/docker-entrypoint-initdb.d/init_timescale.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TIMESCALE_USER}"]
      interval: 30s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # KIWOOM_APP_KEY/SECRET/DART_API_KEY only ever land here, to seed Airflow's
    # encrypted Variables store below — webserver/scheduler never see them as
    # plain container env (see README "Secrets"). Merges the shared env anchor
    # instead of replacing it, so db-migrate still has SQL_ALCHEMY_CONN etc.
    environment:
      <<: *airflow-common-env
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY}
      KIWOOM_APP_SECRET: ${KIWOOM_APP_SECRET}
      DART_API_KEY: ${DART_API_KEY:-}
      DART_API_KEY_2: ${DART_API_KEY_2:-}
      DART_API_KEY_3: ${DART_API_KEY_3:-}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname kr-quant --lastname admin --role Admin --email admin@example.com || true
        airflow variables set KIWOOM_APP_KEY "$$KIWOOM_APP_KEY"
        airflow variables set KIWOOM_APP_SECRET "$$KIWOOM_APP_SECRET"
        if [ -n "$$DART_API_KEY" ]; then airflow variables set DART_API_KEY "$$DART_API_KEY"; fi
        if [ -n "$$DART_API_KEY_2" ]; then airflow variables set DART_API_KEY_2 "$$DART_API_KEY_2"; fi
        if [ -n "$$DART_API_KEY_3" ]; then airflow variables set DART_API_KEY_3 "$$DART_API_KEY_3"; fi
        # 이미 paused 로 등록된 DAG 를 되살린다. 위 DAGS_ARE_PAUSED_AT_CREATION 은
        # **처음 등록될 때만** 적용되므로 기존 메타DB 에 paused 로 박힌 건 그대로
        # 남는다 — daily_krx_shares 의 is_paused_upon_creation 이 무시됐던 것과
        # 똑같은 함정이다. 매 기동마다 한 번 훑어 dags/ 가 정본이 되게 한다.
        #
        # 목록을 여기 적지 않고 dags/*.py 에서 뽑는 이유: 손으로 적은 목록은 DAG 를
        # 추가할 때마다 어긋나고, 어긋난 걸 알려주는 건 아무것도 없다(이 사고가
        # 정확히 그 모양이었다). 안 돌릴 DAG 는 schedule=None 으로 코드에 적는다.
        for f in /opt/airflow/dags/*.py; do
          d=$$(basename "$$f" .py)
          [ "$$d" = "_common" ] && continue
          airflow dags unpause "$$d" >/dev/null 2>&1 || true
        done

  # UI 는 사람이 볼 때만 띄운다 — 상시 RSS 657MB(실측)를 하루 종일 이고 있을
  # 이유가 없다. 수집 자체는 스케줄러만으로 돈다.
  #     docker compose --profile ui up -d airflow-webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    profiles: ["ui"]
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
    restart: unless-stopped

volumes:
  airflow-meta-db-data:
  timescale-data:
