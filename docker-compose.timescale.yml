# trader 전용 — 2026-09-11 부터 **읽기 전용 스트리밍 리플리카**다(원본 이름은
# 그대로 뒀지만 역할이 바뀌었다). PRIMARY 는 이제 simnode 의
# docker-compose.replica.yml 이다 — 헷갈리면 `pg_is_in_recovery()` 로 확인: 여기는
# true 가 나와야 정상이다. 뒤집힌 경위는 docker-compose.replica.yml 헤더 참고.
# scalp-it collector 는 여전히 trader 에서 돌지만 LAN 너머 simnode:5433 에 쓴다.
#
# 24/7 상시(restart: unless-stopped) — cron 으로 올렸다 내리는 대상이 아니다.
# 볼륨은 quant-airflow_timescale-data(외부, pg_basebackup 으로 시딩됨).
#
# ⚠️ 여기에 쓰기를 시도하면 항상 실패한다(read-only standby) — collector 의
# DSN 은 kr-quant/.env 의 KR_QUANT_DB(simnode:5433)를 봐야 한다. 이 파일의
# POSTGRES_USER/PASSWORD/DB 는 최초 initdb 때만 쓰이고 지금은 무시된다(디스크에
# 이미 리플리카 데이터가 있어 엔트리포인트가 init 를 건너뛴다) — 남겨둔 이유는
# 이 리플리카가 죽어 볼륨을 통째로 새로 시딩해야 할 때 문서 역할을 하도록.
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_DB: ${TIMESCALE_DB}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./sql/init_timescale.sql:/docker-entrypoint-initdb.d/init_timescale.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TIMESCALE_USER}"]
      interval: 30s
      retries: 10
    restart: unless-stopped

volumes:
  timescale-data:
    external: true
    name: quant-airflow_timescale-data
