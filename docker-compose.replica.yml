# simnode 전용 — 파일 이름은 "replica" 지만 **2026-09-11 pg_promote() 이후 이
# 컨테이너가 PRIMARY 다.** 이름을 바꾸지 않은 이유는 볼륨 이름
# (quant-airflow_timescale-replica-data)과 포트(5433)가 이미 kr-quant/.env,
# quant-airflow/.env 등 여러 곳의 DSN 에 박혀 있어서 — 이름 하나 맞추자고
# 그 전부를 또 바꾸는 게 더 위험하다고 판단했다. `pg_is_in_recovery()` 로
# 실제 역할을 확인할 것 (여기는 false 가 나와야 정상 — primary).
#
# 왜 뒤집혔나: 원래 설계는 실시간 틱 수집기(scalp-it, trader)와 같은 호스트에
# PRIMARY 를 두는 것이었는데, collector.py 에 재연결+디스크 스풀(spool_dir)이
# 들어가 LAN 순단을 스스로 버티는 게 실전 검증(2026-09-11, trader DB 로 왕복
# insert 확인)됐다. 그래서 PRIMARY 를 자원이 넉넉한 여기(simnode)로 승격하고,
# trader 는 리플리카로 재구성했다(docker-compose.timescale.yml, trader 쪽 사본).
#
# 연구 쿼리도 이제 여기가 정본이다 — 61GB 램에 전체가 캐시된다. trader 의
# docker-compose.timescale.yml(포트 5432)은 이제 읽기 전용 리플리카고, 원본
# 쪽 pg_hba.conf 에 replication 라인이 있어야 trader 가 여기 붙을 수 있다
# (2026-09-11 추가함 — 192.168.45.0/24).
#
# 2026-09-11 밤 — trader 리플리카가 WAL 세그먼트 삭제(`max_slot_wal_keep_size`
# 100GB 초과)로 스트리밍이 끊겨 죽었었다. 2026-09-12 새벽 `pg_basebackup -R -C
# -S trader_replica` 로 전체 재시딩 완료 — streaming 재개, replay_lsn 이 primary
# sent_lsn 과 일치, ticks 카운트 원본=리플리카 정확히 일치(14,318,563) 검증됨.
#
# 재발 방지 메모: `max_slot_wal_keep_size`(현재 100GB, 디스크는 832GB 여유)는
# trader 리플리카가 그만큼 뒤처지는 동안 아무도 못 알아채면 여전히 뚫린다.
# 2026-09-13 부터 scripts/daily_health_check.sh 의 report_replication 이 슬롯
# 상태를 하루 두 번 로그에 남기지만, 알림(푸시·실패 exit)은 아직 없다.
services:
  timescaledb-replica:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "5433:5432"
    volumes:
      - timescale-replica-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timescale-replica-data:
    name: quant-airflow_timescale-replica-data
    external: true
