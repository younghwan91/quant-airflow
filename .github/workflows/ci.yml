name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 컨테이너는 apache/airflow:2.10.5-python3.11 을 쓴다(docker/Dockerfile).
        # 3.12/3.13 도 함께 도는 이유: collectors/ 는 Airflow 없이 `python -m` 으로도
        # 실행되는 순수 모듈이라, 런타임을 올릴 때 미리 깨지는 걸 보려는 것이다.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 런타임 의존을 그대로 설치해 실제 컨테이너와 같은 집합을 검증한다.
          pip install -r docker/requirements.txt
          # ruff 는 핀한다 — 기본 룰셋이 릴리스마다 넓어져서, 코드를 안 건드려도
          # CI 가 갑자기 빨개진다. pyproject 의 select 명시와 한 쌍이다.
          pip install pytest 'ruff==0.14.0'

      - name: Lint
        run: ruff check collectors/ dags/ tests/ scripts/

      - name: DAG 파싱
        # DAG 파일이 문법·import 오류 없이 로드되는지. Airflow 를 설치하지 않으므로
        # 실제 DagBag 대신 AST 파싱으로 확인한다 — 스케줄 오타나 깨진 import 를
        # 배포 전에 잡는 최소 안전망.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("dags").glob("*.py")):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          print(f"{len(list(pathlib.Path('dags').glob('*.py')))} DAG 파일 파싱")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: 시크릿 스캔
        # 이 레포는 공개다. Sharadar 직판 키는 재발급이 불가능한 상태이므로
        # (2026-08-15), 한 번 커밋되면 되돌릴 방법이 없다 — 히스토리에 남는다.
        # 실제로 벤더 API 가 `?api_key=` 로 인증하고 requests 의 HTTPError 가
        # 실패한 URL 을 통째로 메시지에 담아, 로그에 평문으로 찍힌 전례가 있다.
        # 추적 대상 파일에 키 모양 문자열이 들어오면 여기서 막는다.
        run: |
          python - <<'PY'
          import re, subprocess, sys
          # 32자 hex(벤더 키 형태) / api_key=<값> / DSN 비밀번호
          PATTERNS = [
              (re.compile(r"\b[0-9a-f]{32}\b"), "32자 hex — API 키 형태"),
              (re.compile(r"(?i)\bapi_?key\s*[=:]\s*['\"]?[A-Za-z0-9_\-]{16,}"), "api_key 리터럴"),
              (re.compile(r"[a-z][a-z0-9+.-]*://[^:/@\s]+:[^@/\s]{6,}@"), "DSN 비밀번호"),
          ]
          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()
          hits = []
          for path in files:
              if path.startswith(".github/workflows/"):
                  continue  # 이 스캐너 자신의 정규식이 걸린다
              try:
                  text = open(path, encoding="utf-8").read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  # `${VAR}` 치환 자리표시자는 시크릿이 아니다 — compose 의
                  # `...:${AIRFLOW_META_PASSWORD}@...` 가 DSN 패턴에 걸린다.
                  if "${" in line:
                      continue
                  # 마스킹을 검증하려면 테스트에 가짜 시크릿이 있어야 한다.
                  # 표식을 그 줄에 직접 달게 해서, 예외가 파일 단위가 아니라
                  # 한 줄 단위로만 열리게 한다 — tests/ 를 통째로 제외하면
                  # 진짜 사고도 같이 놓친다.
                  if "allowlist-secret" in line:
                      continue
                  for pattern, why in PATTERNS:
                      if pattern.search(line):
                          hits.append(f"{path}:{line_no}: {why}")
          if hits:
              print("시크릿으로 보이는 문자열이 추적 파일에 있습니다:")
              print("\n".join(hits))
              sys.exit(1)
          print(f"{len(files)}개 추적 파일 스캔 — 깨끗함")
          PY

      - name: Test
        run: pytest -q
